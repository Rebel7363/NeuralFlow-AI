name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Training runs end to end
        run: python train.py > /dev/null

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t neuralflow-ai .
      - name: Smoke test the container
        run: |
          docker run -d --name nf -p 8000:8000 neuralflow-ai
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" -d @examples/benign_sample.json
          docker logs nf
          docker rm -f nf
